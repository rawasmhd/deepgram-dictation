name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --locked

      - name: Upload dictation.exe
        uses: actions/upload-artifact@v7
        with:
          name: dictation-exe
          path: rust/target/release/dictation.exe

  bench:
    # the benchmark needs a desktop and a Deepgram key, so CI only compiles it
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile check
        run: python -m py_compile bench/bench.py
