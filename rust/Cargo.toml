[package]
name = "dictation"
version = "0.1.0"
edition = "2021"
description = "Push-to-talk dictation for Windows (Rust rewrite, prototype)"
license = "MIT"
publish = false

[dependencies]
cpal = "0.15"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
