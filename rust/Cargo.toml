[package]
name = "dictation"
version = "0.1.0"
edition = "2021"
description = "Push-to-talk dictation for Windows (Rust rewrite)"
license = "MIT"
publish = false

[dependencies]
cpal = "0.15"
hound = "3"
# Pinned: newer schannel uses windows-sys 0.61, which needs dlltool.exe
# (not part of the GNU toolchain). Unpin when we build with MSVC (#11).
native-tls = "=0.2.14"
schannel = "=0.1.27"
serde_json = "1"
# Windows' own TLS (SChannel) for both, so no C compiler is needed
tungstenite = { version = "0.24", features = ["native-tls"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
